<!DOCTYPE html>
<html>
<head>

<title>Shubh Grihasti | Domestic Support Services in Bangalore</title>

<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:#ADD8E6;
color:#000;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 60px;
background:#0a0a0a;
border-bottom:2px solid #ff2a2a;
position:relative;
}

.logo img {
  max-width: 80px;
  height: auto;
}

.nav-right{
display:flex;
align-items:center;
}

nav a{
margin-left:25px;
text-decoration:none;
color:#ffd700;
font-weight:600;
}

.phone{
margin-left:25px;
color:#ff3b3b;
font-weight:600;
}

.bookbtn{
background:#ff2a2a;
color:white;
padding:10px 20px;
border-radius:6px;
margin-left:25px;
text-decoration:none;
font-weight:600;
}

/* HAMBURGER */

.menu-toggle{
display:none;
font-size:28px;
color:#ffd700;
cursor:pointer;
}

/* HERO */

.hero{
display:flex;
align-items:center;
justify-content:space-between;
padding:80px 60px;
gap:40px;
}

.hero-text{
width:50%;
}

.hero-text h1{
font-size:42px;
color:#0B6623;
}

.hero-text p{
font-size:18px;
color:white;
margin-bottom:25px;
}

.service-buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.service-buttons div{
background:#ff2a2a;
color:white;
padding:14px;
border-radius:6px;
text-align:center;
font-weight:600;
}

.hero-img{
width:50%;
}

.hero-img img{
width:100%;
border-radius:12px;
}

/* SECTION */

.section{
padding:80px 60px;
text-align:center;
}

.section h2{
color:#ff3b3b;
font-size:34px;
}

/* SERVICES */

.grid{
display:flex;
flex-direction:column;
gap:25px;
margin-top:40px;
}

.card{
display:flex;
align-items:center;
gap:20px;
background:#111;
padding:20px;
border-radius:10px;
border:1px solid #222;
}

.card img{
width:220px;
height:140px;
object-fit:cover;
border-radius:8px;
}

.card h3{
color:#ffd700;
}

.card p{
color:white;
}

/* WHY */

.why{
background:#0d0d0d;
padding:80px 60px;
text-align:center;
}

.why p{
color:white;
font-size:18px;
}

/* FORM */

form{
max-width:500px;
margin:auto;
}

input,select,textarea{
width:100%;
padding:14px;
margin:10px 0;
border-radius:6px;
border:none;
font-size:16px;
height:50px;
box-sizing:border-box;
}

textarea{
height:100px;
}

button{
background:#ff2a2a;
color:white;
border:none;
padding:14px 25px;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.callback{
color:#ffd700;
margin-top:10px;
font-weight:600;
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{ text-shadow:0 0 5px #ffd700; }
to{ text-shadow:0 0 15px #ffd700,0 0 25px #ff2a2a; }
}

/* PROCESS */

.process-grid{
display:flex;
align-items:center;
justify-content:center;
flex-wrap:wrap;
gap:15px;
margin-top:40px;
}

.step{
background:#111;
padding:25px;
border-radius:10px;
width:220px;
border:1px solid #222;
}

.step h3{
color:#ff2a2a;
font-size:28px;
margin-bottom:10px;
}

.step p{
color:white;
}

.arrow{
font-size:30px;
color:#ffd700;
}

/* TESTIMONIALS */

.testimonial-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:40px;
}

.testimonial{
background:#111;
padding:25px;
border-radius:10px;
border:1px solid #222;
color:white;
}

.testimonial h4{
margin-top:15px;
color:#ffd700;
}

/* CONTACT */

.contact{
text-align:center;
padding:80px 60px;
background:#0d0d0d;
}

.contact p{
color:white;
}

/* FOOTER */

footer{
background:black;
color:#ffd700;
text-align:center;
padding:25px;
border-top:2px solid #ff2a2a;
}

/* WHATSAPP BUTTON */

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
padding:12px;
border-radius:50%;
animation:buzz 1s infinite;
}

.whatsapp img{
width:24px;
}

/* CALL BUTTON */

.callbtn{
position:fixed;
bottom:80px;
right:20px;
background:#007BFF;
color:white;
padding:12px;
border-radius:50%;
font-size:20px;
text-decoration:none;
animation:buzz 1s infinite;
}

/* BUZZ ANIMATION */

@keyframes buzz{
0% { transform: translateX(0); }
25% { transform: translateX(-3px); }
50% { transform: translateX(3px); }
75% { transform: translateX(-3px); }
100% { transform: translateX(0); }
}

/* MOBILE */

@media(max-width:768px){

nav{padding:20px;}

.menu-toggle{display:block;}

.nav-right{
position:fixed;
top:80px;
right:-100%;
width:220px;
max-height:50vh;
overflow-y:auto;

background:#87CEFA;
padding:25px 20px;
border-radius:12px 0 0 12px;

flex-direction:column;
box-shadow:-5px 0 15px rgba(0,0,0,0.2);
z-index:1000;

display:flex;
transition:right 0.35s ease;
}

.nav-right a,
.phone{
margin:12px 0;
font-size:18px;
color:#003366;
text-align:center;
}

.nav-right.active{
right:0;
}

.hero{
flex-direction:column;
padding:50px 20px;
text-align:center;
}

.hero-text,.hero-img{width:100%;}

.hero-text h1{font-size:32px;}

.service-buttons{grid-template-columns:repeat(2,1fr);}

.section{padding:60px 20px;}

.card{flex-direction:column;text-align:center;}

.card img{width:100%;height:auto;}

}

</style>
</head>

<body>

<nav>

<div class="logo">
<img src="logosmall.png" alt="Shubh Grihasti Logo">
</div>

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<div class="nav-right" id="navMenu">
<a href="#">Home</a>
<a href="#services">Services</a>
<a href="#about">About</a>
<a href="#contact">Contact</a>
<div class="phone">📞 8151835253</div>
<a class="bookbtn" href="#booking">Book Now</a>
</div>

</nav>

<!-- REST OF YOUR CODE REMAINS SAME -->
